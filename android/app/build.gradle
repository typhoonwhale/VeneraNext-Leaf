plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

ext.abiCodes = ["arm64-v8a": 2]

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def configuredStoreFile = keystoreProperties.getProperty("storeFile")?.trim()
def releaseStoreFile = configuredStoreFile ? file(configuredStoreFile) : null
def releaseSigningAvailable = signingProperties.every {
    keystoreProperties.getProperty(it)?.trim()
} && releaseStoreFile?.isFile()

android {
    // Keep the upstream namespace because the Android Kotlin sources use it.
    // The applicationId below is the installed app identity and must stay unique.
    namespace = "com.github.cyrilpeng.veneranext"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "28.0.13004108"

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    splits{
        abi {
            reset()
            include 'arm64-v8a'
            enable true
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions{
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
                storeFile releaseStoreFile
                storePassword keystoreProperties.getProperty("storePassword")
            }
        }
    }

    defaultConfig {
        applicationId = "com.github.typhoonwhale.veneranext.leaf"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    // Flutter also creates a profile build type with default ABI filters.
    // The single ARM64 split owns ABI selection for every build type.
    buildTypes.configureEach {
        ndk.abiFilters.clear()
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (variant.buildType.name == "release") {
                if (abi != null) {
                    outputFileName = "VeneraNext-Leaf-${variant.versionName}-android-${abi}.apk"
                    def abiVersionCode = project.ext.abiCodes.get(abi)
                    if (abiVersionCode != null) {
                        versionCodeOverride = variant.versionCode * 10 + abiVersionCode
                    }
                } else {
                    outputFileName = "VeneraNext-Leaf-${variant.versionName}-android.apk"
                    versionCodeOverride = variant.versionCode * 10
                }
            } else if (variant.buildType.name == "debug") {
                versionCodeOverride = variant.versionCode * 10 + 4
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.doFirst {
            if (!releaseSigningAvailable) {
                throw new GradleException(
                    "VeneraNext Leaf release builds require the fixed signing key. " +
                    "Provide android/key.properties and its referenced keystore; " +
                    "unsigned or temporary-key APKs are not upgradeable release packages."
                )
            }
        }
    }
}
