name: Leaf ARM64 Release 构建
run-name: Leaf ARM64 Release 构建 ${{ github.ref_name }}

# v* 标签发版时由 main.yml 调用，也可手动运行，只产出 artifact。
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: leaf-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Build_Android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: 校验标签元数据
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/validate_release.py
      - name: 校验分支元数据
        if: github.ref_type != 'tag'
        run: python3 .github/scripts/validate_release.py --build-only
      - name: 释放 Android 构建所需磁盘空间
        run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 解码并安装 Android 证书
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          if [[ -z "${STORE_FILE:-}" || -z "${PROPERTY_FILE:-}" ]]; then
            echo "::error::Android release requires this fork's fixed ANDROID_KEYSTORE and ANDROID_KEY_PROPERTIES secrets. Upstream signing secrets are unavailable to a fork."
            exit 1
          fi
          printf '%s' "$STORE_FILE" | base64 --decode > android/keystore.jks
          printf '%s\n' "$PROPERTY_FILE" > android/key.properties
          if [[ ! -s android/keystore.jks ]]; then
            echo "::error::ANDROID_KEYSTORE decoded to an empty file; refusing to build a release APK."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android
      - name: 配置 Gradle 插件仓库
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/plugin-repositories.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF
      - name: 检查 rust-toolchain.toml
        run: rustup show
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: 验证 Android 分享文件与回调归属
        working-directory: android
        run: ./gradlew :share_plus:testShareOwnership
      - name: 校验单一 ARM64 产物并生成摘要
        run: |
          set -euo pipefail
          cd build/app/outputs/apk/release
          shopt -s nullglob
          apks=(*.apk)
          if (( ${#apks[@]} != 1 )) || [[ "${apks[0]}" != *-arm64-v8a.apk ]]; then
            echo "::error::Leaf release must contain exactly one ARM64 APK."
            exit 1
          fi
          sha256sum "${apks[0]}" > SHA256SUMS.txt
      - name: 校验 APK 签名证书
        env:
          EXPECTED_CERT_SHA256: ddf1ca6f03578cd9b41470670cd3a21637772ea9e3ceab4f6d9ea9c0e8d5e909
        run: |
          set -euo pipefail
          apksigner=$(ls -d "${ANDROID_HOME:-}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner not found under \$ANDROID_HOME/build-tools."
            exit 1
          fi
          shopt -s nullglob
          apks=(build/app/outputs/apk/release/*-arm64-v8a.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one ARM64 APK to verify."
            exit 1
          fi
          if ! output=$("$apksigner" verify --print-certs "${apks[0]}"); then
            echo "::error::apksigner verify failed for ${apks[0]}."
            exit 1
          fi
          printf '%s\n' "$output"
          # apksigner prints "Signer #1 certificate ..." or, in newer build-tools,
          # "V2 Signer: certificate ..." (one line per signature scheme).
          pairs=$(printf '%s\n' "$output" | sed -n -E 's/^(V[0-9.]+ )?Signer( ?#([0-9]+))?:? certificate SHA-256 digest: *([0-9A-Fa-f]+).*$/\3 \4/p')
          signers=$(printf '%s\n' "$pairs" | awk 'NF { print (NF == 2 ? $1 : 1) }' | sort -u | wc -l | tr -d '[:space:]')
          if [[ "$signers" != "1" ]]; then
            echo "::error::Expected exactly one signer, found $signers."
            exit 1
          fi
          digests=$(printf '%s\n' "$pairs" | awk 'NF { print tolower($NF) }' | sort -u)
          if [[ $(printf '%s\n' "$digests" | wc -l | tr -d '[:space:]') != "1" ]]; then
            echo "::error::Signature schemes report different certificates."
            exit 1
          fi
          actual="$digests"
          actual_lc="$digests"
          expected_lc=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]')
          if [[ "$actual_lc" != "$expected_lc" ]]; then
            echo "::error::APK signing certificate mismatch: expected $EXPECTED_CERT_SHA256, got ${actual:-none}."
            exit 1
          fi
      - name: 上传 Leaf ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: leaf-android-arm64-release
          path: |
            build/app/outputs/apk/release/*-arm64-v8a.apk
            build/app/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
