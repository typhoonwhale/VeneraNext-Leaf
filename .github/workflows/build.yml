name: Leaf ARM64 Release 构建
run-name: Leaf ARM64 Release 构建 ${{ github.ref_name }}

# Optional cloud build. Official releases currently use the local fixed Leaf key.
on:
  workflow_dispatch:

concurrency:
  group: leaf-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Build_Android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: 校验标签元数据
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/validate_release.py
      - name: 校验分支元数据
        if: github.ref_type != 'tag'
        run: python3 .github/scripts/validate_release.py --build-only
      - name: 释放 Android 构建所需磁盘空间
        run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 解码并安装 Android 证书
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          if [[ -z "${STORE_FILE:-}" || -z "${PROPERTY_FILE:-}" ]]; then
            echo "::error::Android release requires this fork's fixed ANDROID_KEYSTORE and ANDROID_KEY_PROPERTIES secrets. Upstream signing secrets are unavailable to a fork."
            exit 1
          fi
          printf '%s' "$STORE_FILE" | base64 --decode > android/keystore.jks
          printf '%s\n' "$PROPERTY_FILE" > android/key.properties
          if [[ ! -s android/keystore.jks ]]; then
            echo "::error::ANDROID_KEYSTORE decoded to an empty file; refusing to build a release APK."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android
      - name: 配置 Gradle 插件仓库
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/plugin-repositories.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF
      - name: 检查 rust-toolchain.toml
        run: rustup show
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: 验证 Android 分享文件与回调归属
        working-directory: android
        run: ./gradlew :share_plus:testShareOwnership
      - name: 校验单一 ARM64 产物并生成摘要
        run: |
          set -euo pipefail
          cd build/app/outputs/apk/release
          shopt -s nullglob
          apks=(*.apk)
          if (( ${#apks[@]} != 1 )) || [[ "${apks[0]}" != *-arm64-v8a.apk ]]; then
            echo "::error::Leaf release must contain exactly one ARM64 APK."
            exit 1
          fi
          sha256sum "${apks[0]}" > SHA256SUMS.txt
      - name: 上传 Leaf ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: leaf-android-arm64-release
          path: |
            build/app/outputs/apk/release/*-arm64-v8a.apk
            build/app/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
