name: PR Android ARM64 冒烟构建
run-name: "PR Android ARM64 冒烟构建 #${{ github.event.pull_request.number }}"

on:
  pull_request:

concurrency:
  group: pr-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: 平台变更范围
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 检测纯文档变更
        id: scope
        run: python3 .github/scripts/ci_scope.py

  android:
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    name: Android 冒烟构建
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - run: flutter pub get --enforce-lockfile
      - name: 构建 Android Debug APK
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi


  platform_gate:
    name: 平台冒烟构建门禁
    needs: [changes, android]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 汇总平台检查结果
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_gate.py android
