name: Leaf 发布校验
run-name: Leaf 发布校验 ${{ github.ref_name }}

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Release_Metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 校验正式版标签位于 main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          # 预发布标签（含 -）可从任意分支发布；正式版只能发布 main 上的提交。
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "预发布标签 ${GITHUB_REF_NAME} 不限制来源分支。"
            exit 0
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::正式版标签 ${GITHUB_REF_NAME} 指向的提交 ${commit} 不在 main 上；请先合入 main 再打标签，或改用含 - 的预发布标签。"
            exit 1
          fi
      - name: 校验发布标签元数据
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/validate_release.py
      - name: 校验分支构建元数据
        if: github.ref_type != 'tag'
        run: python3 .github/scripts/validate_release.py --build-only

  Quality:
    needs: Release_Metadata
    uses: ./.github/workflows/analyze.yml

  Build:
    needs: Release_Metadata
    uses: ./.github/workflows/build.yml
    secrets: inherit

  Release:
    needs: [Release_Metadata, Quality, Build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: 校验发布元数据
        run: python3 .github/scripts/validate_release.py --write-notes release_notes.md
      - uses: actions/download-artifact@v8
        with:
          name: leaf-android-arm64-release
          path: outputs
      - name: 校验发布产物
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(outputs/*-arm64-v8a.apk)
          sums=(outputs/SHA256SUMS.txt)
          if (( ${#apks[@]} != 1 || ${#sums[@]} != 1 )); then
            echo "::error::outputs must contain exactly one ARM64 APK and one SHA256SUMS.txt."
            exit 1
          fi
          (cd outputs && sha256sum -c SHA256SUMS.txt)
      - name: 创建草稿 Release 并上传资产
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(outputs/*-arm64-v8a.apk)
          args=(
            --title "Leaf ${GITHUB_REF_NAME#v}"
            --notes-file release_notes.md
            --draft
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${apks[0]}" outputs/SHA256SUMS.txt "${args[@]}"
      - name: 发布草稿 Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
      - name: 清理同版本预发布
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 仅正式版发布成功后清理；清理失败只告警，不影响已成功的发布。
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "预发布不清理。"
            exit 0
          fi
          prefix="${GITHUB_REF_NAME}-"
          if ! releases="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"; then
            echo "::warning::无法列出 Release，跳过 ${prefix}* 清理。"
            exit 0
          fi
          if ! refs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${prefix}" --jq '.[].ref')"; then
            echo "::warning::无法列出标签，跳过 ${prefix}* 清理。"
            exit 0
          fi
          while IFS= read -r ref; do
            tag="${ref#refs/tags/}"
            [[ "$tag" == "$prefix"* ]] || continue
            if grep -qxF -- "$tag" <<< "$releases"; then
              gh release delete "$tag" --cleanup-tag --yes \
                || echo "::warning::删除 Release ${tag} 失败。"
            else
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
                || echo "::warning::删除标签 ${tag} 失败。"
            fi
          done <<< "$refs"
          exit 0
