name: 依赖安全审查

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: 依赖变更范围
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 检测纯文档变更
        id: scope
        run: python3 .github/scripts/ci_scope.py

  dependency_review:
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' && github.event_name == 'pull_request' }}
    name: 依赖安全审查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 检查新增依赖漏洞
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-patched-versions: true

  rust_audit:
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    name: Rust 锁定依赖漏洞扫描
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 安装固定版本的审计工具
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: 扫描完整 Rust 锁文件
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/security
          cargo audit --file packages/rhttp/rust/Cargo.lock --deny unsound 2>&1 | tee build/security/rust-audit.log
      - name: 保留依赖审计结果
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-dependency-audit
          path: build/security/rust-audit.log
          if-no-files-found: ignore
          retention-days: 14

  dependency_gate:
    name: 依赖安全门禁
    needs: [changes, dependency_review, rust_audit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 汇总依赖检查结果
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_gate.py dependency_review rust_audit
