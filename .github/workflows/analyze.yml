name: "代码分析"
on:
  workflow_call:
    inputs:
      full_ci:
        description: Force full validation for reusable release callers
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  changes:
    name: 质量变更范围
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 检测纯文档变更
        id: scope
        env:
          FORCE_FULL: ${{ inputs.full_ci || false }}
        run: python3 .github/scripts/ci_scope.py

  rhttp-native:
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    name: Rhttp 原生回调生命周期
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 验证锁定原生源码的取消与回调收尾
        env:
          RUSTFLAGS: --cfg reqwest_unstable
        run: cargo test --locked --manifest-path packages/rhttp/rust/Cargo.toml --lib
      - name: 编译 Flutter 测试使用的 Rhttp 库
        env:
          RUSTFLAGS: --cfg reqwest_unstable
        run: cargo build --locked --manifest-path packages/rhttp/rust/Cargo.toml --lib
      - uses: actions/upload-artifact@v7
        with:
          name: linux-rhttp-test-library
          path: packages/rhttp/rust/target/debug/librhttp.so
          if-no-files-found: error
          retention-days: 1

  analyze:
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: python3 .github/scripts/release_version.py --check
      - run: python3 .github/scripts/check_structure_imports.py
      - run: python3 .github/scripts/check_architecture_dependencies.py
      - name: 运行脚本单元测试
        run: |
          set -euo pipefail
          # Leaf 只维护 Android ARM64：保留上游同步来的 Windows 脚本与测试文件，但 CI 不运行 test_windows_*.py。
          tests="$(cd .github/scripts/tests && ls test_*.py | grep -v '^test_windows_' | sed 's/\.py$//')"
          PYTHONPATH=.github/scripts/tests python3 -m unittest $tests
      - run: flutter pub get --enforce-lockfile
      - name: 准备并验证独立代码审查工具
        working-directory: tool/code_audit
        run: |
          dart pub get --enforce-lockfile
          dart run bin/self_check.dart
          dart analyze --fatal-infos
      - run: dart tool/check_git_dependencies.dart
      - name: 检查本次修改的 Dart 格式
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ -n "${BASE_SHA:-}" ]]; then
            diff_range="${BASE_SHA}...HEAD"
          else
            diff_range="HEAD^...HEAD"
          fi
          mapfile -t dart_files < <(git diff --diff-filter=ACMRTUXB --name-only "$diff_range" -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then
            echo "本次没有修改 Dart 文件。"
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"
      - run: flutter analyze --fatal-infos --fatal-warnings

  flutter-tests:
    needs: [changes, rhttp-native]
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    name: Flutter 测试与覆盖率
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: linux-rhttp-test-library
          path: build/test-native/lib
      - name: 准备 Linux 原生测试库
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
          python3 .github/scripts/prepare_linux_test_libraries.py
      - run: flutter test --coverage
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/test-native/lib
      - name: 汇总 Dart 覆盖率
        run: python3 .github/scripts/report_dart_coverage.py coverage/lcov.info --github-summary
      - name: 上传 Dart 覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  quality_gate:
    name: 质量检查门禁
    needs: [changes, analyze, rhttp-native, flutter-tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 汇总质量检查结果
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_gate.py analyze rhttp-native flutter-tests
